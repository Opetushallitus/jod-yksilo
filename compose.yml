services:
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./scripts/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf
    command: valkey-server /usr/local/etc/valkey/valkey.conf

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yksilo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
      - ./scripts/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    labels:
      org.springframework.boot.jdbc.parameters: 'user=yksilo&password=yksilo'

  tmt-mock-api:
    build:
      context: ./tmt-mock
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8580:8080"


  mpassid-mock-api:
    build:
      context: ./mpassid-mock
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8380:8080"

  tmt-osaamissuosittelija-api:
    build:
      dockerfile: Dockerfile.osaamissuosittelija
    ports:
      - "127.0.0.1:8680:8080"

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP

volumes:
  data:
