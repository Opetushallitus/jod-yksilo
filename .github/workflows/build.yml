name: build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    permissions:
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify third-party action commits are at least 7 days old
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-github-actions-min-commit-age.sh

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon clean build sonar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application
          path: |
            build/libs/jod-yksilo-*.jar
            !build/libs/*-plain.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: build/reports/

  docs:
    needs: build
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Generate documentation
        run: ./gradlew --no-daemon generateOpenApiDocs generateSchemaDocs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: build/openapi/openapi.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-schema-diagrams
          path: build/schemaspy/diagrams

      - name: Generate Swagger UI documentation
        if: github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon generateSwaggerUiDocs -x generateOpenApiDocs

      - name: Assemble GitHub Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p build/github-pages
          cp -r build/swagger-ui/.  build/github-pages/swagger-ui/
          cp -r build/schemaspy/.   build/github-pages/schemaspy/

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/github-pages

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  package:
    needs: build
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.short-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application
          path: build/libs

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.JOD_UTIL_AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: docker-meta
        with:
          images: "${{ secrets.JOD_ECR }}/oph/jod-yksilo"
          tags: |
            type=sha

      - name: Output short tag
        id: short-tag
        run: |
          echo "Short tag: ${DOCKER_METADATA_OUTPUT_TAGS##*:}"
          echo "tag=${DOCKER_METADATA_OUTPUT_TAGS##*:}" >> $GITHUB_OUTPUT

      - name: Login to public ECR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: public.ecr.aws
        env:
          AWS_REGION: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.JOD_ECR }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-build
        with:
          pull: true
          push: "${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}"
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          file: docker/Dockerfile
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-development:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: package
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      environment: development
      tag: ${{ needs.package.outputs.tag }}

  deploy-test:
    if: github.ref == 'refs/heads/main'
    needs:
      - package
      - deploy-development
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      environment: test
      tag: ${{ needs.package.outputs.tag }}

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs:
      - package
      - deploy-development
    uses: ./.github/workflows/deploy.yml
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      environment: production
      tag: ${{ needs.package.outputs.tag }}
