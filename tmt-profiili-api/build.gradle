import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'java-library'
  id 'org.springframework.boot' apply false
  id 'io.spring.dependency-management'
  id 'org.openapi.generator'
}

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

dependencyManagement {
  imports {
    mavenBom SpringBootPlugin.BOM_COORDINATES
  }
}

dependencies {
  implementation 'jakarta.annotation:jakarta.annotation-api'
  implementation 'tools.jackson.core:jackson-databind'
}

tasks.register("openApiGenerateP51", GenerateTask) {
  globalProperties = [
      modelDocs : "false",
      apis      : "false",
      models    : "",
      modelTests: "false",
  ]
  generatorName = "java"
  inputSpec = file("${projectDir}/src/openapi/P51-tmt-profile-tuonti-V1.yaml")
  outputDir = file("${projectDir}/build/generated/sources/openapi")
  configOptions = [
      "dateLibrary"            : "java8",
      "library"                : "restclient",
      "modelPackage"           : "fi.okm.jod.yksilo.external.tmt.model",
      "useJakartaEe"           : "true",
      "hideGenerationTimestamp": "true",
      "containerDefaultToNull" : "true",
  ]
}

tasks.register("openApiGenerateP60", GenerateTask) {
  globalProperties = [
      modelDocs : "false",
      apis      : "false",
      models    : "",
      modelTests: "false",
  ]
  generatorName = "java"
  inputSpec = file("${projectDir}/src/openapi/P60-tmt-profile-haku-V1.yaml")
  outputDir = file("${projectDir}/build/generated/sources/openapi")
  configOptions = [
      "dateLibrary"            : "java8",
      "library"                : "restclient",
      "modelPackage"           : "fi.okm.jod.yksilo.external.tmt.model",
      "useJakartaEe"           : "true",
      "hideGenerationTimestamp": "true",
      "containerDefaultToNull" : "true",
  ]
}

sourceSets.main.java.srcDirs += ["${projectDir}/build/generated/sources/openapi/src/main/java"]
compileJava.dependsOn tasks.openApiGenerateP51
compileJava.dependsOn tasks.openApiGenerateP60
